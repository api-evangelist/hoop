aid: hoop
name: Hoop
description: >-
  Hoop is an AI retention agent for Shopify subscription brands, built by the
  founding team behind Trello and backed by Index Ventures. It plugs into a
  brand's helpdesk (Gorgias, Zendesk, or Kustomer), intercepts every
  subscription-cancellation ticket, and runs a tailored save conversation in the
  brand's voice: it asks why the subscriber wants to leave, then matches a
  retention offer (pause, plan swap, discount, or skip) to the stated reason and
  writes the accepted change back to the billing tool (Recharge or Skio)
  automatically. Hoop logs every cancellation reason, offer, and outcome so
  brands learn why subscribers churn, and lets teams A/B test save offers through
  plain-English policy changes rather than macros. It is an end-user SaaS
  application rather than an API provider — it consumes the Shopify, Gorgias,
  Zendesk, Recharge, and Skio APIs and exposes no public developer API, SDK, or
  documentation of its own.
